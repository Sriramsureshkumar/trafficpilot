spring.application.name=trafficpilot
management.endpoints.web.exposure.include=health,info

spring.r2dbc.url=${TRAFFICPILOT_DB_URL:r2dbc:postgresql://localhost:5432/trafficpilot}
spring.r2dbc.username=${TRAFFICPILOT_DB_USERNAME:trafficpilot}
spring.r2dbc.password=${TRAFFICPILOT_DB_PASSWORD}
spring.sql.init.mode=always

spring.data.redis.host=localhost
spring.data.redis.port=6379

trafficpilot.security.bootstrap-admin-username=${TRAFFICPILOT_ADMIN_USERNAME:admin}
trafficpilot.security.bootstrap-admin-password=${TRAFFICPILOT_ADMIN_PASSWORD:}
trafficpilot.security.token-ttl-hours=8
trafficpilot.security.gateway-api-key=user-secret
trafficpilot.rate-limit.window-seconds=60

trafficpilot.health.enabled=true
trafficpilot.health.interval=30s
trafficpilot.health.initial-delay=5s
trafficpilot.health.timeout=2s
