spring.application.name=trafficpilot
management.endpoints.web.exposure.include=health,info

spring.r2dbc.url=r2dbc:h2:mem:///trafficpilot;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always

spring.data.redis.host=localhost
spring.data.redis.port=6379

trafficpilot.security.admin-api-key=admin-secret
trafficpilot.security.gateway-api-key=user-secret
trafficpilot.rate-limit.window-seconds=60
