services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trafficpilot
      POSTGRES_USER: ${TRAFFICPILOT_DB_USERNAME:-trafficpilot}
      POSTGRES_PASSWORD: ${TRAFFICPILOT_DB_PASSWORD:?Set TRAFFICPILOT_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${TRAFFICPILOT_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: trafficpilot-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: